spring.application.name=87-s3-file-service
server.port=${PORT\:9494}\n
aws.s3.bucket=${S3_BUCKET\:raviteja-87-s3-files}\n
aws.s3.region=${AWS_REGION\:ap-south-1}\n
aws.accessKeyId=${AWS_ACCESS_KEY\:}\n
aws.secretAccessKey=${AWS_SECRET_KEY\:}\n
spring.servlet.multipart.max-file-size=10MB\n
spring.servlet.multipart.max-request-size=10MB
